services:
  db:
    image: postgres:18-alpine
    container_name: productivityOS-db
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-productivityOS}'
      POSTGRES_USER: '${POSTGRES_USER:-user}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-password}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-productivityOS}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - productivityOS-network

  redis:
    image: redis:8-alpine
    container_name: productivityOS-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - productivityOS-network

volumes:
  postgres_data:
    name: productivityOS-postgres-data
    driver: local
  redis_data:
    name: productivityOS-redis-data
    driver: local

networks:
  productivityOS-network:
    name: productivityOS-network
    driver: bridge